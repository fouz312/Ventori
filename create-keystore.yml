name: Create Keystore

# One-time helper for people without keytool. It generates a signing key and uploads it as a
# PRIVATE, 1-day artifact. Copy the 4 values into repository secrets, then delete the artifact.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore release.jks -alias vantora -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Vantora, O=Personal, C=US"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=vantora"
            echo "KEY_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64=$(base64 -w0 release.jks)"
          } > keystore-secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets-DELETE-AFTER-USE
          path: keystore-secrets.txt
          retention-days: 1
