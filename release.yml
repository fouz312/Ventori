name: Signed Release APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag to publish, e.g. v0.1.0 (leave empty to only build)"
        required: false

# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Create them with the "Create Keystore" workflow.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: android-build.yml
          name: qemu-engine
          path: app/src/main/jniLibs
          search_artifacts: true
          if_no_artifact_found: warn
      - run: bash scripts/fetch-firmware.sh
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build signed release APK
        env:
          VANTORA_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          VANTORA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VANTORA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VANTORA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: vantora-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish GitHub release
        if: ${{ inputs.version_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          files: app/build/outputs/apk/release/*.apk
