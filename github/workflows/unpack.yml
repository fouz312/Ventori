name: Unpack project zip

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "ZIP file already uploaded to the repository root"
        default: "Vantora.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unpack and commit
        env:
          ZIP: ${{ inputs.zip_name }}
        run: |
          set -e
          test -f "$ZIP" || { echo "::error::$ZIP not found in the repository root. Upload it first."; ls -la; exit 1; }
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          SRC="$TMP"
          if [ "$(ls -A "$TMP" | wc -l)" = "1" ] && [ -d "$TMP/$(ls -A "$TMP")" ]; then SRC="$TMP/$(ls -A "$TMP")"; fi
          rm -rf "$SRC/.github"
          cp -a "$SRC"/. .
          rm -f "$ZIP"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project from $ZIP" || echo "Nothing to commit"
          git push
          echo "Repository layout now:"
          find . -maxdepth 2 -not -path './.git*' | sort
